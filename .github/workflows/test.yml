name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        zig-version: [master]
    runs-on: ${{ matrix.os }}
    # Share one package directory between the root project and the examples, set
    # explicitly for both: package paths are part of the cache key, and the
    # default `zig-pkg/` is referred to with a relative path, which differs
    # between build roots. Otherwise the examples would rebuild libgrpc.
    env:
      ZIG_LOCAL_PKG_DIR: ${{ github.workspace }}/zig-pkg
    steps:
      - uses: actions/checkout@v7
      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig-version }}
      - run: zig build --summary new
      - run: zig build test --summary new
      - name: Build examples
        working-directory: examples
        run: zig build --summary new
